name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install -r requirements-test.txt
      - run: pytest tests/ --cov=custom_components/phoenixcontact_charx --cov-report=term-missing

  # hassfest and HACS, from the organization's reusable workflow.
  home-assistant:
    permissions:
      contents: read
    uses: klconsultancy/workflows/.github/workflows/home-assistant.yml@e6939b6be36b833baf87de0ce25c0ff4cac96b2f # v1.0.0

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # Single required status check for the branch ruleset. A reusable workflow's job reports
  # the result of all its own jobs.
  ci-success:
    name: CI success
    if: always()
    needs: [tests, home-assistant, dependency-review]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
