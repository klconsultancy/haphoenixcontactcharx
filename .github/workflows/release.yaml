name: Release

# release-please keeps a release pull request open with the next version and its
# changelog, from the Conventional Commits titles on main, and raises the version in
# manifest.json with it. Merging it tags the release and creates the GitHub release,
# which is what HACS offers to users. Both run in the organization's reusable workflow,
# as the release app, which may also create the version tags the "release tags" ruleset
# protects.
#
# A release candidate is a tag such as v1.2.3-rc.1 on main, pushed by an admin (the
# "release tags" ruleset): the reusable workflow turns it into a GitHub pre-release,
# which HACS offers to users who enabled beta versions, so it can be tested before the
# release pull request is merged.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions: {}

jobs:
  release:
    permissions: {} # both jobs act as the app
    uses: klconsultancy/workflows/.github/workflows/release-please.yml@5488c03eb4249425edfe6a692185ab73fa748df3 # main
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
      create-prerelease: true
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
